[project]
name = "ragkb"
version = "0.1.0"
description = "企业知识库 RAG 问答：四类文档解析、父子块切分、稠密+稀疏混合检索、多轮改写、带引用作答"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "乔十一" }]
dependencies = [
    "charset-normalizer>=3.3",
    "markdown-it-py>=3.0",
    "mammoth>=1.7",
    "pymupdf>=1.24",
    "qdrant-client>=1.9",
    "openai>=1.30",
    # 下面两个是直接 import 的，显式声明，不依赖 openai/fastapi 的传递依赖
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/qiaoshiyi/rag-kb"
Repository = "https://github.com/qiaoshiyi/rag-kb"
Issues = "https://github.com/qiaoshiyi/rag-kb/issues"

[project.optional-dependencies]
# 扫描件 OCR 通道。仅在需要解析无文字层 PDF 时安装，体积大（torch 等）
ocr = ["mineru[core]>=2.0"]
# 真实向量化与重排（本地模型）。不装则自动回退到 API 或确定性替身
embed = ["FlagEmbedding>=1.2.11", "torch>=2.0"]
# HTTP 服务层
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = [
    "pytest>=8.0",
    "python-docx>=1.1",   # 仅用于生成测试样例
    "pillow>=10",         # 仅用于 scripts/make_social_preview.py 生成仓库预览图
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
